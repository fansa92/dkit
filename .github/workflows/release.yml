name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm, goarm: "7" }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          suffix=""
          if [ "$GOARCH" = "arm" ] && [ -n "${GOARM:-}" ]; then
            suffix="v${GOARM}"
          fi
          name="dkit_${version}_${GOOS}_${GOARCH}${suffix}"

          bin="dkit"
          [ "$GOOS" = "windows" ] && bin="dkit.exe"

          mkdir -p "dist/${name}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o "dist/${name}/${bin}" .
          cp README.md LICENSE "dist/${name}/"

          if [ "$GOOS" = "windows" ] && command -v zip >/dev/null 2>&1; then
            (cd dist && zip -qr "${name}.zip" "${name}")
          else
            # tar.gz keeps the release alive even on a runner without zip.
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

          # One smoke test on a native target: a binary that builds but cannot
          # run is still a broken release.
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            "dist/${name}/dkit" about --short
            "dist/${name}/dkit" hash --literal hello
          fi

          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dkit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum *.zip *.tar.gz > checksums.txt
          cat checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi
